<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA Absensi - Sistem Absensi Berbasis Wajah</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/mqtt.min.js"></script>
    <script src="js/chart.min.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Dashboard -->
        <section id="dashboard" class="section">
            <h2>Dashboard</h2>
            <div class="dashboard-content">
                <div class="video-container">
                    <h3>Streaming Kamera</h3>
                    <img id="video-stream" src="http://<ESP32_CAM_IP>:80/stream" alt="Streaming Kamera">
                </div>
                <div class="chart-container">
                    <h3>Persentase Kehadiran</h3>
                    <canvas id="attendanceChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Tabel Absensi -->
        <section id="attendance-table" class="section">
            <h2>Daftar Absensi</h2>
            <table id="attendance-table-content">
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>Status</th>
                        <th>Waktu</th>
                        <th>Mata Kuliah</th>
                    </tr>
                </thead>
                <tbody id="attendance-table-body"></tbody>
            </table>
        </section>

        <!-- Jadwal Mata Kuliah -->
        <section id="course-schedule" class="section">
            <h2>Jadwal Absen Mata Kuliah</h2>
            <form id="course-schedule-form">
                <label for="course-name">Nama Mata Kuliah:</label>
                <input type="text" id="course-name" required>
                <label for="schedule-date">Tanggal:</label>
                <input type="date" id="schedule-date" required>
                <label for="start-time-course">Waktu Mulai:</label>
                <input type="time" id="start-time-course" required>
                <label for="end-time-course">Waktu Selesai:</label>
                <input type="time" id="end-time-course" required>
                <button type="submit">Simpan Jadwal</button>
            </form>
        </section>

        <!-- Jadwal Perorangan -->
        <section id="individual-schedule" class="section">
            <h2>Jadwal Absen Perorangan</h2>
            <form id="individual-schedule-form">
                <label for="person-name">Nama Orang:</label>
                <input type="text" id="person-name" required>
                <label for="schedule-date-individual">Tanggal:</label>
                <input type="date" id="schedule-date-individual" required>
                <label for="start-time-individual">Waktu Mulai:</label>
                <input type="time" id="start-time-individual" required>
                <label for="end-time-individual">Waktu Selesai:</label>
                <input type="time" id="end-time-individual" required>
                <button type="submit">Simpan Jadwal</button>
            </form>
        </section>

        <!-- Kontrol Perangkat -->
        <section id="controls" class="section">
            <h2>Kontrol Perangkat</h2>
            <div class="control-group">
                <h3>Kontrol Pintu</h3>
                <button onclick="publishCommand('lintas_alam/door', 'OPEN')">Buka Pintu</button>
                <button onclick="publishCommand('lintas_alam/door', 'CLOSE')">Tutup Pintu</button>
            </div>
            <div class="control-group">
                <h3>Pesan OLED</h3>
                <input type="text" id="oled-message" placeholder="Masukkan pesan">
                <button onclick="publishOledMessage()">Kirim Pesan</button>
            </div>
            <div class="control-group">
                <h3>Kontrol LED ESP32-CAM</h3>
                <button onclick="publishCommand('lintas_alam/lampu', 'ON')">LED ON</button>
                <button onclick="publishCommand('lintas_alam/lampu', 'OFF')">LED OFF</button>
            </div>
            <div class="control-group">
                <h3>Kontrol Ultrasonik</h3>
                <button onclick="publishCommand('lintas_alam/auto_door', 'ON')">Ultrasonik ON</button>
                <button onclick="publishCommand('lintas_alam/auto_door', 'OFF')">Ultrasonik OFF</button>
            </div>
        </section>
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="#dashboard">Dashboard</a>
        <a href="#attendance-table">Absensi</a>
        <a href="#course-schedule">Jadwal Kuliah</a>
        <a href="#individual-schedule">Jadwal Perorangan</a>
        <a href="#controls">Kontrol</a>
    </nav>

</body>
</html>
